<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Diagnostics</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; max-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f4f4f4; text-align: left; }
        h1 { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
<h1>Diagnostics</h1>

<h2>Application Info</h2>
<table>
    <tr><th>Key</th><th>Value</th></tr>
    <tr th:each="entry : ${info.entrySet()}">
        <td th:text="${entry.key}"></td>
        <td th:text="${entry.value}"></td>
    </tr>
</table>

<h2>Health</h2>
<table>
    <tr><th>Status</th><th>Details</th></tr>
    <tr>
        <td th:text="${health.status}"></td>
        <td>
            <pre th:text="${health.details}"></pre>
        </td>
    </tr>
</table>

<h2>Selected Environment Properties</h2>
<table>
    <tr><th>Property</th><th>Value</th></tr>
    <tr th:each="p : ${properties.entrySet()}">
        <td th:text="${p.key}"></td>
        <td th:text="${p.value}"></td>
    </tr>
</table>

</body>
</html>
