basePath: /
definitions:
  main.FileInfo:
    description: Informacje o pliku w systemie
    properties:
      downloadUrl:
        example: /api/files/download/1704067800000000000_document.pdf
        type: string
      fileId:
        example: 1704067800000000000_document.pdf
        type: string
      mimeType:
        example: application/pdf
        type: string
      name:
        example: document.pdf
        type: string
      size:
        example: 1024000
        type: integer
      uploadAt:
        example: "2026-04-29T10:30:00Z"
        type: string
    type: object
  main.KanbanBoard:
    description: Struktura tablicy Kanban z kolumnami i zadaniami
    properties:
      columns:
        additionalProperties:
          items:
            $ref: '#/definitions/main.Task'
          type: array
        type: object
    type: object
  main.Task:
    description: Reprezentacja zadania Kanban
    properties:
      assignee:
        example: OGT_SHADOW
        type: string
      description:
        example: Opis zadania
        type: string
      dueDate:
        example: "2026-12-31"
        type: string
      id:
        example: "1704067800000000000"
        type: string
      title:
        example: Nowe zadanie
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: Informacje o pliku w systemie
  title: ProjecTea File Service API
  version: "1.0"
paths:
  /api/files:
    get:
      description: Zwraca listę wszystkich plików przesłanych do serwera. Zawiera
        informacje o każdym pliku takie jak nazwa, rozmiar, data wysłania i URL do
        pobrania.
      produces:
      - application/json
      responses:
        "200":
          description: Lista plików
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/main.FileInfo'
              type: array
            type: object
        "500":
          description: Błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista wszystkich plików
      tags:
      - Files
  /api/files/{fileId}:
    delete:
      description: Pozwala na usunięcie pliku z serwera na podstawie jego identyfikatora.
        Po usunięciu plik nie będzie dostępny do pobrania.
      parameters:
      - description: Identyfikator pliku
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plik pomyślnie usunięty
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Plik nie znaleziony
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Usuwanie pliku
      tags:
      - Files
  /api/files/download/{fileId}:
    get:
      description: Pozwala na pobranie pliku na podstawie jego identyfikatora. Plik
        jest zwracany jako załącznik do pobrania.
      parameters:
      - description: Identyfikator pliku
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Plik pomyślnie pobierany
          schema:
            type: file
        "404":
          description: Plik nie znaleziony
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pobieranie pliku
      tags:
      - Files
  /api/files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Pozwala na przesłanie pliku do serwera. Maksymalny rozmiar pliku
        to 100MB. Plik otrzymuje unikalny identyfikator opparty na czasowniku nanosekund
        i nazwie oryginału.
      parameters:
      - description: Plik do przesłania
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Plik pomyślnie przesłany
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'Błąd: brak pliku lub plik za duży'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Błąd serwera
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Przesyłanie pliku
      tags:
      - Files
  /api/kanban:
    get:
      description: Zwraca aktualny stan tablicy Kanban z kolumnami i zadaniami.
      produces:
      - application/json
      responses:
        "200":
          description: Tablica Kanban
          schema:
            $ref: '#/definitions/main.KanbanBoard'
      summary: Pobierz tablicę Kanban
      tags:
      - Kanban
  /api/kanban/move:
    post:
      consumes:
      - application/json
      description: Przenosi zadanie między kolumnami lub ustawia pozycję w kolumnie.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            fromColumn:
              type: string
            taskId:
              type: string
            toColumn:
              type: string
            toIndex:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Operacja zakończona powodzeniem
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Zadanie nie znalezione
      summary: Przenieś zadanie
      tags:
      - Kanban
  /api/kanban/tasks:
    post:
      consumes:
      - application/json
      description: Tworzy nowe zadanie w wskazanej kolumnie (domyślnie 'todo').
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            assignee:
              example: OGT_SHADOW
              type: string
            column:
              type: string
            description:
              type: string
            dueDate:
              example: "2026-12-31"
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Utworzone zadanie
          schema:
            $ref: '#/definitions/main.Task'
        "400":
          description: Błąd walidacji
      summary: Utwórz zadanie
      tags:
      - Kanban
  /api/kanban/tasks/{taskId}:
    delete:
      description: Usuwa zadanie Kanban na podstawie identyfikatora.
      parameters:
      - description: Identyfikator zadania
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Zadanie usunięte
          schema:
            additionalProperties:
              type: boolean
            type: object
        "404":
          description: Zadanie nie znalezione
      summary: Usuń zadanie
      tags:
      - Kanban
  /api/notifications/stream:
    get:
      description: Strumień Server-Sent Events (SSE) z notyfikacjami systemowymi.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Aktywny strumień SSE
      summary: Stream notyfikacji SSE
      tags:
      - Notifications
  /api/notify/chat:
    post:
      consumes:
      - application/json
      description: Przyjmuje payload nowej wiadomości czatu i publikuje notyfikację SSE.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            from:
              type: string
            text:
              type: string
          type: object
      produces:
      - text/plain
      responses:
        "200":
          description: Notyfikacja wysłana
        "400":
          description: Błędny JSON
      summary: Webhook notyfikacji czatu
      tags:
      - Notifications
  /health:
    get:
      description: Prosty endpoint do sprawdzenia, czy serwer jest dostępny i działający
        prawidłowo
      produces:
      - application/json
      responses:
        "200":
          description: Serwer działa poprawnie
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sprawdzenie zdrowotności serwera
      tags:
      - Health
schemes:
- http
- https
swagger: "2.0"
