version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    networks:
      - projectea-network
    volumes:
      - ./client:/app
      - ./server/java/src/main/resources/certs:/app/certs:ro
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"

  go-backend:
    image: golang:1.23-alpine
    working_dir: /app
    networks:
      - projectea-network
    volumes:
      - ./server/go:/app
      - /app/pkg/mod
    command: sh -c "go mod download && go run ./src"
    ports:
      - "8081:8081"

  java-backend:
    image: maven:4.0.0-rc-5-eclipse-temurin-25-noble
    working_dir: /app
    networks:
      - projectea-network
    volumes:
      - ./server/java:/app
      - /app/.m2
    command: sh -c "mvn -f /app/pom.xml spring-boot:run"
    ports:
      - "8082:8082"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    networks:
      - projectea-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/java/src/main/resources/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - java-backend

  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: playwright-tests
    command: npx playwright test --no-deps
    environment:
      - BASE_URL=http://java-backend:8082
      - PLAYWRIGHT_ENABLED=true
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - java-backend
      - go-backend
    networks:
      - projectea-network

networks:
  projectea-network:
    driver: bridge